name: heart_valve
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  intl: ^0.20.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  pdf: ^3.11.1
  printing: ^5.13.1
  file_saver: ^0.3.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  google_fonts: ^8.1.0
  showcaseview: ^5.1.0
  google_mobile_ads: ^7.0.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/icon/hv.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/hv.jpg"
  adaptive_icon_background: "#002b66"
  adaptive_icon_foreground: "assets/icon/hv.jpg"

flutter_native_splash:
  color: "#002b66"
  android: true
  ios: true
